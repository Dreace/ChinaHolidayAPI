name: Go Build and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Validate tag
      shell: bash
      run: |
        [[ "$RELEASE_TAG" == v* ]]
        git check-ref-format "refs/tags/$RELEASE_TAG"

    - uses: actions/checkout@v3
      with:
        ref: refs/tags/${{ inputs.tag || github.ref_name }}

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.19'

    - name: Test
      run: go test ./...

    - name: Build
      run: |
        mkdir -p dist
        go build -v -o "dist/ChinaHolidayAPI_$RELEASE_TAG" .

    - name: Create or reuse release
      shell: bash
      run: |
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --verify-tag --title "Release $RELEASE_TAG" --notes ""
        fi

    - name: Upload release asset
      shell: bash
      run: |
        asset_name="ChinaHolidayAPI_$RELEASE_TAG"
        if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
          echo "Asset $asset_name already exists; keeping it."
        else
          gh release upload "$RELEASE_TAG" "dist/$asset_name"
        fi
